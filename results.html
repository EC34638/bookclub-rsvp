<title>Sunday Night Book Club — RSVP Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* Read-only roll call for the Notion embed, in the same green-terminal
     style as the invite. The whole frame is the screen. */
  :root {
    --phos: #6dff9a;
    --phos-dim: #2f8a52;
    --glow: 0 0 4px rgba(109, 255, 154, 0.8), 0 0 14px rgba(109, 255, 154, 0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 18px 20px 16px;
    background: radial-gradient(ellipse at 50% 30%, #0f2416, #06110a 70%, #020604);
    color: var(--phos);
    font-family: "VT323", "Courier New", monospace;
    font-size: 19px;
    text-shadow: var(--glow);
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px); }
  .panel { max-width: 640px; margin: 0 auto; }
  .header-row { display: flex; align-items: flex-start; gap: 14px; }
  .mini-cover { flex: none; width: 56px; border: 1px solid var(--phos-dim); padding: 3px; }
  .header-text { flex: 1; min-width: 0; }
  .eyebrow { margin: 0; font-size: 0.9rem; letter-spacing: 0.14em; color: var(--phos-dim); text-shadow: none; }
  h1 { margin: 0; font-weight: 400; font-size: 1.6rem; letter-spacing: 0.1em; }
  .sub { margin: 0; font-size: 1rem; color: var(--phos-dim); text-shadow: none; }
  .book-title { color: var(--phos); text-shadow: var(--glow); }
  .refresh { flex: none; width: 32px; height: 28px; padding: 0; background: transparent; border: 1px solid var(--phos-dim); color: var(--phos); font: inherit; cursor: pointer; transition: transform 0.4s ease; }
  .refresh.spinning { transform: rotate(360deg); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; margin: 14px 0 6px; border-top: 1px dashed var(--phos-dim); border-bottom: 1px dashed var(--phos-dim); }
  .stat { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px; }
  .stat + .stat { border-left: 1px dashed var(--phos-dim); padding-left: 14px; }
  .stat-num { font-size: 2.4rem; line-height: 1; }
  .stat.not-going .stat-num { color: #ffb4a8; text-shadow: none; }
  .stat-label { font-size: 1rem; letter-spacing: 0.12em; color: var(--phos-dim); text-shadow: none; }
  .responses { list-style: none; margin: 0; padding: 0; }
  .responses li { padding: 5px 0; border-bottom: 1px dotted rgba(47, 138, 82, 0.5); }
  .entry-top { display: flex; gap: 8px; align-items: baseline; }
  .entry-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .entry-dots { flex: 1; min-width: 20px; border-bottom: 2px dotted var(--phos-dim); transform: translateY(-5px); }
  .status.not-going { color: #ffb4a8; text-shadow: none; }
  .entry-reason { margin: 2px 0 0; color: var(--phos-dim); font-size: 0.95rem; text-shadow: none; }
  .entry-time { margin: 0; color: var(--phos-dim); font-size: 0.85rem; text-shadow: none; }
  .empty { margin: 12px 0 0; color: var(--phos-dim); text-shadow: none; }
  .footnote { margin: 10px 0 0; font-size: 0.85rem; color: var(--phos-dim); text-shadow: none; }
</style>
</head>
<body>

<div class="panel">
  <div class="header-row">
    <img class="mini-cover" id="coverImg" src="" alt="" />

    </div>
    <button type="button" class="refresh" id="refreshBtn" title="Refresh now" aria-label="Refresh replies">⟳</button>
  </div>

  <div class="stats">
    <div class="stat going"><span class="stat-num" id="goingCount">0</span><span class="stat-label">ATTENDING</span></div>
    <div class="stat not-going"><span class="stat-num" id="notGoingCount">0</span><span class="stat-label">UNAVAILABLE</span></div>
  </div>

  <ul class="responses" id="responsesList"></ul>
  <p class="empty" id="emptyState">&gt; NO READERS HAVE REPORTED YET.</p>
  <p class="footnote" id="footnote">Updates automatically</p>
</div>

  };

  document.getElementById("clubNameText").textContent = CONFIG.clubName;
  document.getElementById("bookTitleText").textContent = CONFIG.bookTitle;
  document.getElementById("bookAuthorText").textContent = CONFIG.bookAuthor;
  document.getElementById("dateText").textContent = CONFIG.dateText;

  const coverImg = document.getElementById("coverImg");
  if (CONFIG.coverUrl) {
    coverImg.src = CONFIG.coverUrl;
    coverImg.alt = "Cover of " + CONFIG.bookTitle + " by " + CONFIG.bookAuthor;
    coverImg.addEventListener("error", () => { coverImg.style.display = "none"; });
  } else {
    coverImg.style.display = "none";
  }

  // Read-only: same shared kvdb.io state the RSVP + review pages use.
  // GET only, no write key needed. kvdb.io's free tier resets 1,000
  // requests per hour per IP, so a ~20s refresh while visible is well
  // within budget (a tab left open all day is ~180 requests/hour).
  const STATE_URL = "https://kvdb.io/4uEc6jHC7Zyy6Z98YqioAH/state";
  const REFRESH_CHECK_MS = 20000;
  const MIN_REFRESH_GAP_MS = 18000;

  const responsesList = document.getElementById("responsesList");
  const emptyState = document.getElementById("emptyState");
  const goingCount = document.getElementById("goingCount");
  const notGoingCount = document.getElementById("notGoingCount");
  const footnote = document.getElementById("footnote");
  const refreshBtn = document.getElementById("refreshBtn");

  async function fetchResponses() {
    const res = await fetch(STATE_URL, { cache: "no-store" });
    if (res.status === 404) return [];
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    const data = await res.json();
    return Array.isArray(data.responses) ? data.responses : [];
  }

  function initial(name) {
    return name.trim().charAt(0).toUpperCase();
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render(list) {
    const going = list.filter((r) => r.attending).length;
    goingCount.textContent = going;
    notGoingCount.textContent = list.length - going;

    emptyState.style.display = list.length ? "none" : "block";
    responsesList.style.display = list.length ? "block" : "none";

    responsesList.innerHTML = list
      .slice()
      .reverse()
      .map((r) => `
        <li>
          <div class="entry-top">
            <span class="entry-name">${escapeHtml(r.name.toUpperCase())}</span>
            <span class="entry-dots"></span>
            <span class="status ${r.attending ? "going" : "not-going"}">${r.attending ? "ATTENDING" : "UNAVAILABLE"}</span>
          </div>
          ${r.reason ? `<p class="entry-reason">“${escapeHtml(r.reason)}”</p>` : ""}
          <p class="entry-time">${formatTime(r.ts)}</p>
        </li>
      `)
      .join("");
  }

  // Reply rows rise in one after another the first time the list fills.
  (function () {
    const mo = new MutationObserver(() => {
      if (!responsesList.querySelector("li")) return;
      mo.disconnect();
      responsesList.classList.add("enter");
      setTimeout(() => responsesList.classList.remove("enter"), 1600);
    });
    mo.observe(responsesList, { childList: true });
  })();

  async function refresh() {
    try {
      const list = await fetchResponses();
      render(list);
      footnote.textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    } catch (err) {
      footnote.textContent = "Couldn't refresh — will retry shortly";
    }
  }

  let lastRefresh = Date.now();
  refresh();

  refreshBtn.addEventListener("click", () => {
    lastRefresh = Date.now();
    refreshBtn.classList.add("spinning");
    refresh().finally(() => setTimeout(() => refreshBtn.classList.remove("spinning"), 400));
  });

  // Only re-fetch when the embed is actually visible, and not more often
  // than MIN_REFRESH_GAP_MS — kvdb.io's free tier is generous (1,000
  // requests/hour/IP) but there's no reason to hammer it while hidden.
  setInterval(() => {
    if (document.visibilityState === "visible" && Date.now() - lastRefresh > MIN_REFRESH_GAP_MS) {
      lastRefresh = Date.now();
      refresh();
    }
  }, REFRESH_CHECK_MS);
</script>
